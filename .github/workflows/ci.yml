name: CI

# 本文件负责：三平台的质量门禁。任何一条失败都视为不合格。
# 门禁内容与设计文档 01 的 1.9 一致：格式、静态检查、测试、编译。

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          # 提交信息校验需要本次推送之间的完整历史，浅克隆拿不到 before 提交
          fetch-depth: 0

      - name: 校验提交信息规范
        # 规则见 CONTRIBUTING.md：<type>(<scope>): 说明
        # 只在 push 时校验"本次推送引入的提交"，不追溯历史
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          before="${{ github.event.before }}"
          if [ "$before" = "0000000000000000000000000000000000000000" ]; then
            echo "首次推送或无法取得 before，跳过"
            exit 0
          fi
          pattern='^(feat|fix|docs|chore|ci|refactor|test|perf|build)(\([a-z0-9_, -]+\))?: .+'
          bad=0
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            sha="${line%% *}"
            msg="${line#* }"
            if printf '%s' "$msg" | grep -Eq "$pattern"; then
              echo "OK   $sha  $msg"
            else
              echo "::error::提交 $sha 不符合规范：$msg"
              echo "       期望形如 feat(download): 支持断点续传"
              bad=1
            fi
          done < <(git log --format='%h %s' "$before..${{ github.sha }}")
          exit $bad

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 格式检查（gofmt）
        shell: bash
        run: |
          set -euo pipefail
          bad="$(gofmt -l .)"
          if [ -n "$bad" ]; then
            echo "以下文件未通过 gofmt，请先执行 gofmt -w："
            echo "$bad"
            exit 1
          fi

      - name: 静态检查（go vet）
        run: go vet ./...

      - name: 缓存 golangci-lint 二进制
        uses: actions/cache@v4
        with:
          path: "~/go/bin"
          key: golangci-lint-${{ runner.os }}-v2.15.0

      - name: 安装 golangci-lint（命中缓存则跳过）
        shell: bash
        # 为什么不用 marketplace 的 golangci-lint-action：它默认装 v1.x，而 v1.x 依赖的
        # go/types 读不了 Go 1.27 的导出数据，会在三个平台上统一报
        # "export data version 5 is greater than maximum supported version 2"。
        # 这里固定 v2.15.0（与本地开发环境同一版本），本地与 CI 行为一致。
        run: |
          set -euo pipefail
          BIN="$(go env GOPATH)/bin/golangci-lint"
          # Windows 上实际文件名是 golangci-lint.exe，-x 直接测会漏，这里补一次
          if [ -x "${BIN}.exe" ]; then BIN="${BIN}.exe"; fi
          if [ -x "$BIN" ]; then
            echo "命中缓存：$("$BIN" version)"
          else
            go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
          fi
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: 静态检查（golangci-lint，含 errcheck）
        shell: bash
        run: |
          set -euo pipefail
          golangci-lint version
          golangci-lint run --timeout=5m

      - name: 单元测试
        run: go test ./...

      - name: 环境变量注册表集成测试（仅 Windows）
        # 注册表写入只能在真实 Windows 上验证：开发机的受限沙箱会拒绝 RegCreateKeyEx，
        # 那时的用例是 skip 的——而 skip 在日志里同样显示 ok，等于没验证。
        # 这一步专门要求它必须真的执行：出现 SKIP 就判失败。
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          out="$(go test ./internal/envvar/ -run 'TestApplyRevertOnTestKey|TestRemoveDirsFromTestKey' -v -count=1)"
          echo "$out"
          if echo "$out" | grep -q -- "--- SKIP"; then
            echo "::error::注册表集成测试被跳过，说明当前环境不允许写 HKCU，验证不成立"
            exit 1
          fi
          if ! echo "$out" | grep -q -- "--- PASS"; then
            echo "::error::注册表集成测试没有执行"
            exit 1
          fi

      - name: 编译两个入口
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bin
          go build -trimpath -o bin/ ./cmd/...

      - name: 版本信息冒烟测试
        shell: bash
        run: |
          set -euo pipefail
          out_launcher="$(go run ./cmd/envready --version)"
          out_gui="$(go run ./cmd/envready-gui --version)"
          echo "$out_launcher"
          echo "$out_gui"
          case "$out_launcher" in *EnvReady*) ;; *) echo "启动器 --version 输出异常"; exit 1 ;; esac
          case "$out_gui" in *EnvReady*) ;; *) echo "主程序 --version 输出异常"; exit 1 ;; esac

      - name: 断言版本注入生效（ldflags）
        shell: bash
        # 上一步用 go run，链接器参数是空的，只会输出 dev/none —— 也就是说
        # -X 注入一旦写错（例如改 module path 后漏改），整个流程仍然会绿。
        # 这一步专门验证注入：用 ldflags 构建并跑真程序，断言版本号与提交号都出现了。
        run: |
          set -euo pipefail
          MODULE="$(go list -m)"
          VER="v0.0.0-ci"
          COMMIT="$(git rev-parse --short HEAD)"
          OUT="$(go run -ldflags "-X $MODULE/internal/buildinfo.Version=$VER -X $MODULE/internal/buildinfo.Commit=$COMMIT" ./cmd/envready --version)"
          echo "$OUT"
          case "$OUT" in
            *"$VER"*) ;;
            *) echo "::error::版本号未被注入，仍为默认值"; exit 1 ;;
          esac
          case "$OUT" in
            *"$COMMIT"*) ;;
            *) echo "::error::提交号未被注入"; exit 1 ;;
          esac
