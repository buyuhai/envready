name: CI

# 本文件负责：三平台的质量门禁。任何一条失败都视为不合格。
# 门禁内容与设计文档 01 的 1.9 一致：格式、静态检查、测试、编译。

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 格式检查（gofmt）
        shell: bash
        run: |
          set -euo pipefail
          bad="$(gofmt -l .)"
          if [ -n "$bad" ]; then
            echo "以下文件未通过 gofmt，请先执行 gofmt -w："
            echo "$bad"
            exit 1
          fi

      - name: 静态检查（go vet）
        run: go vet ./...

      - name: 静态检查（golangci-lint，含 errcheck）
        uses: golangci/golangci-lint-action@v6
        with:
          # TODO(ci): 首次推送验证后，将版本固定到具体 release，避免上游更新导致门禁漂移
          version: latest
          args: --timeout=5m

      - name: 单元测试
        run: go test ./...

      - name: 编译两个入口
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bin
          go build -trimpath -o bin/ ./cmd/...

      - name: 版本信息冒烟测试
        shell: bash
        run: |
          set -euo pipefail
          out_launcher="$(go run ./cmd/envready --version)"
          out_gui="$(go run ./cmd/envready-gui --version)"
          echo "$out_launcher"
          echo "$out_gui"
          case "$out_launcher" in *EnvReady*) ;; *) echo "启动器 --version 输出异常"; exit 1 ;; esac
          case "$out_gui" in *EnvReady*) ;; *) echo "主程序 --version 输出异常"; exit 1 ;; esac
