# 本文件负责：固定静态检查的"规则集"，让本地与 CI 的行为不随上游默认值漂移。
#
# 为什么必须固定：golangci-lint 大版本升级会改默认启用的 linter 集合
# （v1 → v2 就改过），如果依赖默认值，某天门禁会悄悄变成另一套标准。
# 这里用 default: none + 显式枚举，确保"启用了哪些检查"是我们自己写的。

version: "2"

run:
  timeout: 5m
  tests: true

linters:
  # 不使用默认集合，只跑下面显式列出的检查
  default: none
  enable:
    # 未处理的错误 —— 本项目最关键的一条规则：
    # 参考实现 murig 的大量缺陷都源于"错误被吞掉"，这条从第一天就拦住它
    - errcheck
    # Go 官方 vet 检查（printf、结构体标签、锁拷贝等）
    - govet
    # 赋值后从未使用的变量（死代码）
    - ineffassign
    # 静态分析大集合（v2 起已包含原 gosimple 的检查）
    - staticcheck
    # 未被引用的标识符
    - unused
    # 拼写错误（注释与字符串里的英文单词）
    - misspell

formatters:
  # 交给 CI 里独立的 gofmt 步骤检查；这里只列出来以避免未来版本默认行为变化
  enable:
    - gofmt
